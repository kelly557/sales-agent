<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工程行业销售助手 - 信息图浏览索引</title>
  <style>
    :root {
      --bg: #f7f7f3;
      --paper: rgba(255, 255, 255, .9);
      --ink: #2e4044;
      --muted: #66777b;
      --line: #cbd4d2;
      --line-soft: #e1e6e4;
      --teal: #2498aa;
      --teal-deep: #2b7684;
      --orange: #eab65b;
      --shadow: 0 24px 70px rgba(43, 64, 68, .12);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(61, 78, 82, .05) 1px, transparent 1px) 0 0 / 64px 64px,
        linear-gradient(rgba(61, 78, 82, .04) 1px, transparent 1px) 0 0 / 64px 64px,
        linear-gradient(180deg, #f8f8f4 0%, #eeeeea 100%);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
    }
    h1, h2, p { margin: 0; }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      transition: grid-template-columns .2s ease;
    }
    body.nav-collapsed .shell {
      grid-template-columns: 168px minmax(0, 1fr);
    }

    .side {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 28px 22px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(18px);
      transition: padding .2s ease;
    }
    body.nav-collapsed .side {
      gap: 14px;
      padding: 18px 14px;
    }
    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      transition: gap .2s ease, padding .2s ease;
    }
    body.nav-collapsed .brand {
      justify-content: center;
      gap: 0;
      padding-bottom: 12px;
    }
    .agent-mark {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      position: relative;
      flex: 0 0 auto;
      border-radius: 50%;
      background: conic-gradient(from -40deg, var(--teal) 0 43%, #fff 43% 70%, var(--orange) 70% 100%);
      box-shadow: inset 0 0 0 1px rgba(43,118,132,.28);
    }
    .agent-mark::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(43,118,132,.26);
    }
    .agent-mark span {
      position: relative;
      color: var(--teal-deep);
      font-size: 10px;
      line-height: 1.1;
      font-weight: 900;
      text-align: center;
    }
    .brand h1 {
      font-size: 22px;
      line-height: 1.16;
      font-weight: 950;
      letter-spacing: 0;
    }
    .brand p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.38;
    }
    body.nav-collapsed .brand h1,
    body.nav-collapsed .brand p {
      display: none;
    }

    .collapse-btn {
      width: 100%;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--teal-deep);
      border: 1px solid var(--line);
      background: rgba(255,255,255,.76);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 950;
    }
    .collapse-btn:hover {
      border-color: rgba(36,152,170,.55);
      background: #fff;
    }
    .collapse-icon {
      font-size: 15px;
      line-height: 1;
    }
    body.nav-collapsed .collapse-label {
      display: none;
    }

    .nav {
      display: grid;
      gap: 10px;
    }
    .nav button {
      width: 100%;
      padding: 14px;
      color: var(--ink);
      text-align: left;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.72);
      cursor: pointer;
      font: inherit;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    body.nav-collapsed .nav button {
      min-height: 58px;
      padding: 10px 8px;
      text-align: center;
    }
    .nav button:hover {
      transform: translateY(-1px);
      border-color: rgba(36,152,170,.55);
      background: #fff;
    }
    .nav button.active {
      border-color: var(--teal);
      background: linear-gradient(90deg, rgba(36,152,170,.14), rgba(255,255,255,.9));
      box-shadow: inset 4px 0 0 var(--teal);
    }
    .nav b {
      display: block;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 950;
    }
    body.nav-collapsed .nav b {
      font-size: 14px;
      line-height: 1.25;
    }
    .nav span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .nav small {
      display: inline-flex;
      margin-top: 10px;
      padding: 4px 7px;
      color: var(--teal-deep);
      border: 1px solid #c2d3d1;
      background: #fff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .3px;
    }
    body.nav-collapsed .nav span,
    body.nav-collapsed .nav small {
      display: none;
    }

    .open-link {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 42px;
      margin-top: auto;
      color: #fff;
      background: var(--teal-deep);
      border: 1px solid var(--teal-deep);
      text-decoration: none;
      font-size: 14px;
      font-weight: 950;
    }
    body.nav-collapsed .open-link {
      min-height: 38px;
      padding: 0 8px;
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
    }
    .hint {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }
    body.nav-collapsed .hint {
      display: none;
    }

    .main {
      min-width: 0;
      padding: 24px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
      margin-bottom: 16px;
    }
    .title h2 {
      font-size: 30px;
      line-height: 1.16;
      font-weight: 950;
    }
    .title p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .tag {
      padding: 7px 10px;
      color: var(--teal-deep);
      background: rgba(255,255,255,.82);
      border: 1px solid #bac7c5;
      font-size: 11px;
      font-weight: 950;
      white-space: nowrap;
    }

    .viewer-wrap {
      height: calc(100vh - 126px);
      min-height: 720px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #fff;
    }

    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
      body.nav-collapsed .shell { grid-template-columns: 1fr; }
      .side {
        position: static;
        height: auto;
      }
      body.nav-collapsed .side {
        padding: 12px;
      }
      body.nav-collapsed .brand,
      body.nav-collapsed .open-link,
      body.nav-collapsed .hint {
        display: none;
      }
      body.nav-collapsed .nav {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      body.nav-collapsed .nav button {
        min-height: 44px;
        padding: 8px 6px;
      }
      body.nav-collapsed .nav b {
        font-size: 13px;
      }
      .open-link { margin-top: 0; }
      .viewer-wrap {
        height: 72vh;
        min-height: 560px;
      }
    }
  </style>
</head>
<body class="nav-collapsed">
  <main class="shell">
    <aside class="side">
      <section class="brand">
        <div class="agent-mark"><span>Agent<br>Native</span></div>
        <div>
          <h1>工程行业智能文档能力平台</h1>
          <p>信息图原型统一浏览索引。</p>
        </div>
      </section>

      <button class="collapse-btn" id="collapseBtn" type="button" aria-expanded="false" title="展开导航">
        <span class="collapse-icon" aria-hidden="true">›</span>
        <span class="collapse-label">展开导航</span>
      </button>

      <nav class="nav" aria-label="信息图页面">
        <button class="active" type="button" data-src="engineering-document-agent-product-introduction-infographic.html" data-title="产品介绍信息图">
          <b>01 产品介绍</b>
          <span>从产品定位、核心价值、能力结构到工程资料交付成果的总览页。</span>
          <small>INTRODUCTION</small>
        </button>
        <button type="button" data-src="engineering-document-competitor-analysis.html" data-title="竞品分析信息图">
          <b>02 竞品分析</b>
          <span>整合竞品汇总表、核心竞品深析和竞争机会判断。</span>
          <small>COMPETITOR ANALYSIS</small>
        </button>
        <button type="button" data-src="engineering-document-agent-platform-architecture-infographic.html" data-title="平台架构信息图">
          <b>03 架构</b>
          <span>展示智能文档能力平台的架构分层、任务流和关键能力模块。</span>
          <small>ARCHITECTURE</small>
        </button>
        <button type="button" data-src="engineering-document-agent-user-journey-map.html" data-title="核心用户旅程地图">
          <b>04 用户旅程</b>
          <span>展示用户输入、AI 问答与任务入口、Agent 执行细节、交互和服务支持。</span>
          <small>USER JOURNEY</small>
        </button>
      </nav>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="title">
          <h2 id="pageTitle">产品汇报</h2>
      
        </div>
      </header>
      <div class="viewer-wrap">
        <iframe id="viewer" title="信息图预览" src="engineering-document-agent-product-introduction-infographic.html"></iframe>
      </div>
    </section>
  </main>

  <script>
    const buttons = Array.from(document.querySelectorAll(".nav button"));
    const viewer = document.querySelector("#viewer");
    const pageTitle = document.querySelector("#pageTitle");
    const collapseBtn = document.querySelector("#collapseBtn");
    const collapseIcon = document.querySelector(".collapse-icon");
    const collapseLabel = document.querySelector(".collapse-label");

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        buttons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        viewer.src = button.dataset.src;
        pageTitle.textContent = button.dataset.title;
      });
    });

    collapseBtn.addEventListener("click", () => {
      const collapsed = document.body.classList.toggle("nav-collapsed");
      collapseBtn.setAttribute("aria-expanded", String(!collapsed));
      collapseBtn.setAttribute("title", collapsed ? "展开导航" : "折叠导航");
      collapseIcon.textContent = collapsed ? "›" : "‹";
      collapseLabel.textContent = collapsed ? "展开导航" : "折叠导航";
    });
  </script>
</body>
</html>
